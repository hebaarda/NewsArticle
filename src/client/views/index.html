        <header>
            <div class="">  Logo  </div>

        <main>
            <section>
                <form id="urlForm" method="post">
                    <input id="name" type="text" name="url" placeholder="Enter URL" required>

                </form>
            </section>

            <div id="error" style="display: none;"></div>

            <section>
                <strong>Form Results:</strong>
                <div id="results">
                    <div id="loader" style="display: none;"></div>

                    <ul id="resultsList">
                        <li id="agreement">agreement: </li>
                        <li id="subjectivity">subjectivity: </li>
                        <li id="confidence">confidence: </li>
                        <li id="irony">irony: </li>
                        <li id="score_tag">score_tag: </li>
                    </ul>
                </div>
            </section>
        </main>

        <footer>
            <p> This is a footer </p>
        </footer>
